<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GETI Collaboration Administration</title><style>
:root{font-family:Arial,sans-serif;color:#193252;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}header{background:#063d88;color:white;padding:23px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}main{max-width:1250px;margin:24px auto;padding:0 18px}.panel{background:white;border-radius:14px;padding:22px;box-shadow:0 3px 14px #103a6d12;margin-bottom:18px}input,select,button{padding:11px;border-radius:8px;border:1px solid #b6c8dd;font-size:14px}button{background:#0757b8;color:white;cursor:pointer;border:0}button:hover{background:#003f8d}button:disabled{opacity:.55}input{max-width:100%;width:100%}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.filters input{flex:2;min-width:190px}.filters select{flex:1;min-width:160px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0}th{background:#edf4ff}.scroll{overflow:auto}td button{margin:2px}.muted{color:#63748a}#detail{display:none}#detail pre{white-space:pre-wrap;word-break:break-word;font:14px Arial;line-height:1.6}#identity{max-width:110px;max-height:110px;border-radius:50%;object-fit:cover}#signature{max-width:280px;max-height:100px}#login{max-width:450px;margin:45px auto}#dashboard{display:none}.pill{padding:6px 9px;border-radius:20px;background:#e9f1ff;display:inline-block}label{display:block;margin:12px 0 5px;font-weight:600}a{color:#0757b8}@media(max-width:700px){header{padding:18px}th,td{padding:8px}}</style></head><body>
<header><div><strong>GLOBAL ENGLISH TEACHING INSTITUTE</strong><div>Collaboration • Administration</div></div><button id="logout" style="display:none">Log Out</button></header>
<main><section id="login" class="panel"><h2>GETI Admin Sign In</h2><p class="muted">Authorized administrators only — admin@getienglish.com</p><form id="loginForm"><label>Email</label><input id="email" type="email" required autocomplete="username" value="admin@getienglish.com"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><p><button type="submit">Sign In</button></p></form><p id="loginError" role="alert"></p></section>
<div id="dashboard"><section class="panel"><h2>Collaboration Applications</h2><p id="counts" class="muted"></p><div class="filters"><input id="search" placeholder="Search name, email, registration ID, organization"><select id="filter"><option value="">All account statuses</option><option value="awaiting_admin">Awaiting Admin</option><option value="activated">Activated</option><option value="deactivated">Deactivated</option></select><button id="reload">Refresh</button><button id="export">Export CSV</button></div><div class="scroll"><table><thead><tr><th>Registration ID</th><th>Applicant</th><th>Organization</th><th>Email</th><th>Application</th><th>Account</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="detail" class="panel"><h2>Applicant Dossier</h2><div id="detailBody"></div><label>Application Status</label><select id="applicationStatus"><option value="pending_review">Pending Review</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><label>Account Status</label><select id="accountStatus"><option value="awaiting_admin">Awaiting Admin</option><option value="activated">Activated</option><option value="deactivated">Deactivated</option></select><p><button id="save">Save Admin Decision</button> <button id="close" type="button">Close</button></p><p id="saveMsg" role="status"></p></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://syawyulrelrhjprnxdyn.supabase.co','sb_publishable_4TupKAcHcAcvnJC9NxdhAg_fbxwEy_8');let records=[],selected=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function verify(){const {data:{user}}=await db.auth.getUser();const email=user?.email?.toLowerCase();if(email!=='admin@getienglish.com'||user?.is_anonymous){$('login').style.display='block';$('dashboard').style.display='none';$('logout').style.display='none';return false;}$('login').style.display='none';$('dashboard').style.display='block';$('logout').style.display='block';await load();return true;}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='Signing in...';const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginError').textContent=error.message;return;}$('loginError').textContent='';await verify();};
$('logout').onclick=async()=>{await db.auth.signOut();await verify();};
async function load(){const {data,error}=await db.from('collaboration_applications').select('*').order('created_at',{ascending:false}).limit(1000);if(error){$('counts').textContent='Database error: '+error.message;return;}records=data||[];render();}
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const a=records.filter(r=>(!f||r.account_status===f)&&[r.registration_id,r.full_name,r.email,r.organization].join(' ').toLowerCase().includes(q));$('counts').textContent=records.length+' applications • '+records.filter(x=>x.account_status==='activated').length+' activated • '+records.filter(x=>x.account_status==='deactivated').length+' deactivated • '+records.filter(x=>x.account_status==='awaiting_admin').length+' awaiting admin';$('rows').innerHTML=a.map(r=>`<tr><td>${esc(r.registration_id)}</td><td>${esc(r.full_name)}</td><td>${esc(r.organization)}</td><td>${esc(r.email)}</td><td><span class="pill">${esc(r.application_status)}</span></td><td>${esc(r.account_status)}</td><td>${new Date(r.created_at).toLocaleDateString()}</td><td><button data-id="${esc(r.id)}">Open</button></td></tr>`).join('')||'<tr><td colspan="8">No applications found.</td></tr>';$('rows').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>openDossier(b.dataset.id));}
function openDossier(id){selected=records.find(x=>x.id===id);if(!selected)return;const r=selected,d=r.application_data||{};let h=`<p><strong>Registration ID:</strong> ${esc(r.registration_id)}<br><strong>Name:</strong> ${esc(r.full_name)}<br><strong>Email:</strong> <a href="mailto:${encodeURIComponent(r.email)}">${esc(r.email)}</a><br><strong>Phone:</strong> ${esc(r.phone)}<br><strong>Organization:</strong> ${esc(r.organization)}</p>`;if(r.identity_photo?.startsWith('data:image/'))h+=`<img id="identity" src="${r.identity_photo}" alt="Applicant photo">`;h+='<h3>Application Details</h3>';for(const [k,v] of Object.entries(d)){if(k==='identity_photo'||k==='signature')continue;h+=`<p><strong>${esc(k.replaceAll('_',' '))}:</strong> ${esc(v)}</p>`;}if(d.signature?.startsWith('data:image/'))h+=`<h3>Signature</h3><img id="signature" src="${d.signature}" alt="Applicant signature">`;$('detailBody').innerHTML=h;$('applicationStatus').value=r.application_status;$('accountStatus').value=r.account_status;$('saveMsg').textContent='';$('detail').style.display='block';$('detail').scrollIntoView({behavior:'smooth'});}
$('save').onclick=async()=>{if(!selected)return;$('saveMsg').textContent='Saving...';const {error}=await db.from('collaboration_applications').update({application_status:$('applicationStatus').value,account_status:$('accountStatus').value}).eq('id',selected.id);$('saveMsg').textContent=error?'Error: '+error.message:'Decision saved in Supabase.';if(!error)await load();};
$('close').onclick=()=>$('detail').style.display='none';$('reload').onclick=load;$('search').oninput=render;$('filter').onchange=render;
$('export').onclick=()=>{const cols=['registration_id','full_name','email','phone','organization','application_status','account_status','created_at'];const csv=[cols.join(','),...records.map(r=>cols.map(c=>'"'+String(r[c]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='geti-collaborations.csv';a.click();URL.revokeObjectURL(a.href);};verify();
</script></body></html>
