<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GETI Official Photo Gallery | Global English Teaching Institute</title>
<meta name="description" content="Official photographs and updates from Global English Teaching Institute (GETI): English learning, TEFL, TESOL training, certificates and educational activities.">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="googlebot" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://getienglish.com/gallery/">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{color-scheme:light;--navy:#082e5d;--blue:#095eac;--ink:#17314d;--muted:#61748a;--line:#e2e9f3}
*{box-sizing:border-box}
body{margin:0;background:#f4f7fc;color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:inherit}
.site-header{background:linear-gradient(120deg,#082e5d,#0a5493);color:#fff;padding:46px 20px 40px;text-align:center}
.site-header h1{font-size:clamp(25px,4vw,40px);line-height:1.2;margin:0}
.site-header p{margin:12px 0 0;color:#d8eafb}
.wrap{width:min(1130px,100%);margin:auto;padding:34px 20px 55px}
.topline{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px}
.topline h2{font-size:24px;margin:0}
.topline p{margin:4px 0 0;color:var(--muted)}
.back{font-weight:650;text-decoration:none;background:white;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.gallery figure{margin:0;background:#fff;overflow:hidden;border-radius:16px;box-shadow:0 7px 26px #10284612;border:1px solid #e4ebf3}
.gallery a.photo{display:block;background:#eaf0f7;aspect-ratio:4/3;overflow:hidden}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.gallery a.photo:hover img{transform:scale(1.04)}
.gallery figcaption{padding:15px 17px;font-weight:650;overflow-wrap:anywhere}
.gallery small{display:block;font-weight:400;color:var(--muted);margin-top:3px}
.status{color:var(--muted);font-size:14px;margin:23px 0 0}
footer{text-align:center;border-top:1px solid var(--line);padding:25px 16px;color:#607187;background:#fff}
dialog{border:0;border-radius:16px;padding:0;max-width:min(94vw,1080px);max-height:92vh;box-shadow:0 14px 65px #081c3d77}
dialog::backdrop{background:#071b37d9}
.preview-wrap{background:white;padding:12px}
.preview-wrap img{display:block;max-width:100%;max-height:74vh;object-fit:contain;margin:auto}
.preview-head{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:5px 6px 12px}
.preview-head p{margin:0;font-weight:650;overflow-wrap:anywhere}
.preview-head button{background:#eaf0f7;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:20px}
@media(max-width:560px){.site-header{padding:35px 16px}.wrap{padding:24px 15px 40px}.gallery{grid-template-columns:1fr;gap:16px}}
</style>
</head>
<body>
<header class="site-header">
<h1>Global English Teaching Institute</h1>
<p>GETI • Official Photo Gallery</p>
</header>
<main class="wrap">
<div class="topline">
<div><h2>Our Official Photos</h2><p>Explore GETI educational activities, training and certificate services.</p></div>
<a class="back" href="/">← GETI Home</a>
</div>
<section id="geti-gallery" class="gallery" aria-label="GETI official photographs">
<!-- These initial images are included in HTML for Google and for visitors whose browsers block the GitHub API. -->
<figure data-filename="geti.jpg">
<a class="photo" href="/gallery/images/geti.jpg" data-title="Global English Teaching Institute">
<img src="/gallery/images/geti.jpg" alt="Official GETI Global English Teaching Institute photograph" loading="eager" decoding="async">
</a><figcaption>Global English Teaching Institute<small>GETI official gallery</small></figcaption>
</figure>
<figure data-filename="geti cert.jpg">
<a class="photo" href="/gallery/images/geti%20cert.jpg" data-title="GETI Certificates">
<img src="/gallery/images/geti%20cert.jpg" alt="GETI official certificate photo" loading="lazy" decoding="async">
</a><figcaption>GETI Certificates<small>Certificates and training</small></figcaption>
</figure>
</section>
<p id="gallery-status" class="status" role="status" aria-live="polite">Official GETI images. New uploads are checked automatically.</p>
</main>
<dialog id="geti-photo-dialog" aria-label="Image preview">
<div class="preview-wrap">
<div class="preview-head"><p id="preview-title">GETI Photo</p><button id="preview-close" type="button" aria-label="Close image preview">×</button></div>
<img id="preview-image" alt="">
</div>
</dialog>
<footer>© Global English Teaching Institute · <a href="https://getienglish.com/">getienglish.com</a></footer>
<script>
(function(){
  "use strict";
  const gallery=document.getElementById("geti-gallery");
  const status=document.getElementById("gallery-status");
  const dialog=document.getElementById("geti-photo-dialog");
  const preview=document.getElementById("preview-image");
  const previewTitle=document.getElementById("preview-title");
  const seen=new Set(Array.from(gallery.querySelectorAll("[data-filename]")).map(el=>el.dataset.filename));
  const titleFromFilename=name=>name.replace(/\.[^.]+$/,"").replace(/[-_]+/g," ").replace(/\s+/g," ").trim();
  const imageTypes=/\.(jpg|jpeg|png|webp|gif|avif)$/i;
  function addImage(name){
    if(!name||seen.has(name)||!imageTypes.test(name))return;
    seen.add(name);
    const title=titleFromFilename(name);
    const url="/gallery/images/"+encodeURIComponent(name);
    const figure=document.createElement("figure");
    figure.dataset.filename=name;
    const a=document.createElement("a");a.className="photo";a.href=url;a.dataset.title=title;
    const img=document.createElement("img");img.src=url;img.alt="GETI official photo: "+title;img.loading="lazy";img.decoding="async";
    a.appendChild(img);
    const caption=document.createElement("figcaption");caption.textContent=title;
    const sub=document.createElement("small");sub.textContent="GETI official gallery";caption.appendChild(sub);
    figure.append(a,caption);
    gallery.appendChild(figure);
  }
  // The repository folder is public. Load only image filenames; never execute content from GitHub.
  const endpoint="https://api.github.com/repos/Globalenglishteachinginstitute/geti-website/contents/gallery/images?ref=main";
  fetch(endpoint,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"})
    .then(r=>{if(!r.ok)throw new Error("Gallery listing unavailable");return r.json()})
    .then(files=>{
      if(!Array.isArray(files))throw new Error("Unexpected listing");
      files.filter(file=>file&&file.type==="file"&&typeof file.name==="string"&&imageTypes.test(file.name))
        .sort((a,b)=>a.name.localeCompare(b.name)).forEach(file=>addImage(file.name));
      status.textContent=seen.size+" official photo"+(seen.size===1?"":"s")+" available. New photos appear automatically after upload to the GitHub gallery/images folder.";
    })
    .catch(()=>{status.textContent="Showing available GETI photos. Additional images may appear after refreshing the page.";});
  gallery.addEventListener("click",event=>{
    const anchor=event.target.closest("a.photo");
    if(!anchor||!dialog.showModal)return;
    event.preventDefault();
    preview.src=anchor.href;
    preview.alt=anchor.querySelector("img")?.alt||"GETI Photo";
    previewTitle.textContent=anchor.dataset.title||"GETI Photo";
    dialog.showModal();
  });
  document.getElementById("preview-close").addEventListener("click",()=>dialog.close());
  dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close()});
  dialog.addEventListener("close",()=>{preview.removeAttribute("src")});
})();
</script>
</body>
</html>
