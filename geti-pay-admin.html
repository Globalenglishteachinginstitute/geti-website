<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GETI • Payment Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#14234b}header{background:#071c68;color:white;padding:20px 30px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:21px}main{max-width:1500px;margin:auto;padding:24px}.box,.card{background:#fff;border:1px solid #dce5f0;border-radius:14px;box-shadow:0 4px 18px #102b6012}.login{max-width:480px;margin:70px auto;padding:25px}.login input,.login button{width:100%;height:45px;margin-top:10px;border-radius:8px}.login input{border:1px solid #cbd8e8;padding:0 12px}.login button,.btn{border:0;background:#0873e8;color:#fff;font-weight:bold;padding:0 16px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{padding:18px}.card span{color:#68758d}.card b{font-size:28px;display:block;margin-top:8px}.box{padding:18px;margin-top:17px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.tools input,.tools select,.btn{height:42px;border-radius:8px}.tools input,.tools select{border:1px solid #cbd8e8;padding:0 12px}.tools input{flex:1;min-width:250px}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #e7edf4;text-align:left;font-size:13px}th{background:#f4f8fd}.tag{padding:5px 9px;border-radius:20px;font-weight:bold}.PAID{background:#ddf7e7;color:#08783b}.PENDING{background:#fff1c9;color:#8b6200}.FAILED{background:#ffe3e9;color:#b71936}.REVIEW{background:#ece6ff;color:#6241a5}#dash{display:none}.scroll{overflow:auto}.empty{text-align:center;padding:35px;color:#718096}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}table{min-width:1250px}}</style></head>
<body><header><div><h1>GETI Payment Admin</h1><small>Global English Teaching Institute</small></div><b>ADMINISTRATION</b></header><main>
<section id="login" class="box login"><h2>Special Admin Access</h2><p>Secure access to GETI payment records.</p><input id="key" type="password" placeholder="Global password"><button onclick="openAdmin()">Open Dashboard</button><p id="msg"></p></section>
<section id="dash"><div class="stats"><div class="card"><span>Total</span><b id="s0">0</b></div><div class="card"><span>Paid</span><b id="s1">0</b></div><div class="card"><span>Pending</span><b id="s2">0</b></div><div class="card"><span>Failed / Review</span><b id="s3">0</b></div></div>
<div class="box"><div class="tools"><input id="q" oninput="render()" placeholder="Search name, email, phone, Student ID, reference…"><select id="st" onchange="render()"><option value="">All statuses</option><option>PAID</option><option>PENDING</option><option>FAILED</option><option>REVIEW</option></select><button class="btn" onclick="load()">Refresh</button></div><div id="tbl" class="scroll"></div></div></section></main>
<script>
const API="https://syawyulrelrhjprnxdyn.supabase.co/functions/v1/geti-zopayo-payment";let data=[];
const E=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GLOBAL_PASSWORD="CHANGE_ME";
async function openAdmin(){
  const k=document.getElementById("key").value;
  const m=document.getElementById("msg");
  if(k!==GLOBAL_PASSWORD){m.textContent="Incorrect password.";return;}
  login.style.display="none";dash.style.display="block";
  await load();
}
async function load(){
  const m=document.getElementById("msg");m.textContent="";
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"admin_payments"})});
    const j=await r.json();
    if(!r.ok)throw Error(j.error||"Unable to load payments.");
    data=j.payments||[];render();
  }catch(e){
    tbl.innerHTML='<div class="empty">'+E(e.message)+'</div>';
  }
}
function render(){let q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("st").value,f=data.filter(x=>(!s||x.status===s)&&(!q||[x.full_name,x.email,x.phone,x.student_id,x.relation_id,x.product,x.exam].join(" ").toLowerCase().includes(q)));s0.textContent=data.length;s1.textContent=data.filter(x=>x.status==="PAID").length;s2.textContent=data.filter(x=>x.status==="PENDING").length;s3.textContent=data.filter(x=>["FAILED","REVIEW"].includes(x.status)).length;tbl.innerHTML=f.length?`<table><thead><tr><th>Date</th><th>Your name</th><th>Email</th><th>Phone</th><th>Student ID</th><th>Motif</th><th>Exam</th><th>USD</th><th>Paid amount</th><th>Status</th><th>Reference</th></tr></thead><tbody>${f.map(x=>`<tr><td>${E(new Date(x.created_at).toLocaleString())}</td><td><b>${E(x.full_name)}</b></td><td>${E(x.email)}</td><td>${E(x.phone)}</td><td>${E(x.student_id)}</td><td>${E(x.product)}</td><td>${E(x.exam||"-")}</td><td>${x.price_usd==null?"-":"$"+E(x.price_usd)}</td><td><b>${E(Number(x.amount).toLocaleString())} ${E(x.currency)}</b></td><td><span class="tag ${E(x.status)}">${E(x.status)}</span></td><td>${E(x.relation_id)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No payment found.</div>`}
</script></body></html>
